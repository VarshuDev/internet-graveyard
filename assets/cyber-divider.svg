<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 20" width="100%" height="20">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="1"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="div-glow">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="0" y1="10" x2="920" y2="10" stroke="url(#div-grad)" stroke-width="1.5" filter="url(#div-glow)"/>
  <circle cx="460" cy="10" r="4.5" fill="#00f5d4" filter="url(#div-glow)"/>
  <circle cx="460" cy="10" r="2" fill="#ffffff"/>
  <circle cx="420" cy="10" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="500" cy="10" r="2.5" fill="#a855f7" opacity="0.8"/>
</svg>
