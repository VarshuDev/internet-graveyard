<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <style>
      @keyframes glassSpin {
        0% { transform: rotate(0deg); }
        45% { transform: rotate(0deg); }
        55% { transform: rotate(180deg); }
        100% { transform: rotate(180deg); }
      }
      @keyframes sandFall {
        0%, 100% { opacity: 0.3; transform: scaleY(0.7); }
        50% { opacity: 1; transform: scaleY(1.3); filter: drop-shadow(0 0 3px #00f5d4); }
      }
      .glass-container { animation: glassSpin 5s cubic-bezier(0.77, 0, 0.175, 1) infinite; transform-origin: 12px 12px; }
      .falling-sand { animation: sandFall 1.8s ease-in-out infinite; stroke: #00f5d4; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>
  <g class="glass-container">
    <!-- Hourglass Frame -->
    <path d="M5 22h14M5 2h14M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="rgba(56, 189, 248, 0.05)" />
    <!-- Center Trickling Sand Stream -->
    <line class="falling-sand" x1="12" y1="11" x2="12" y2="15" />
    <circle cx="12" cy="18" r="1.5" fill="#a855f7" />
  </g>
</svg>
