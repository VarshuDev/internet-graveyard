<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <style>
      @keyframes floatGhost {
        0%, 100% { transform: translateY(0px) rotate(0deg); filter: drop-shadow(0 0 3px #00f5d4); }
        50% { transform: translateY(-2.5px) rotate(1.5deg); filter: drop-shadow(0 0 8px #a855f7) drop-shadow(0 0 14px rgba(0,245,212,0.4)); }
      }
      @keyframes blinkGaze {
        0%, 90%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      .ghost-body { animation: floatGhost 3.2s ease-in-out infinite; transform-origin: center; }
      .ghost-eyes { animation: blinkGaze 4s ease-in-out infinite; transform-origin: 12px 10px; }
    </style>
  </defs>
  <g class="ghost-body">
    <!-- Ghost Silouette with Ripper Base -->
    <path d="M12 3a7 7 0 0 0-7 7v9l3-1.8 3 1.8 3-1.8 3 1.8 3-1.8V10a7 7 0 0 0-7-7z" stroke="#00f5d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="rgba(0, 245, 212, 0.08)" />
    <!-- Neural Digital Visor / Eyes -->
    <g class="ghost-eyes">
      <circle cx="9.5" cy="10" r="1.5" fill="#38bdf8" />
      <circle cx="14.5" cy="10" r="1.5" fill="#38bdf8" />
    </g>
    <!-- Digital Core Circuit Node -->
    <line x1="10" y1="14" x2="14" y2="14" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
