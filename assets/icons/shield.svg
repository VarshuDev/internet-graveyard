<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <style>
      @keyframes shieldPulse {
        0%, 100% { filter: drop-shadow(0 0 2px #00f5d4); stroke: #00f5d4; }
        50% { filter: drop-shadow(0 0 6px #38bdf8) drop-shadow(0 0 10px rgba(0,245,212,0.4)); stroke: #38bdf8; }
      }
      @keyframes checkGlow {
        0%, 100% { stroke: #10b981; }
        50% { stroke: #00f5d4; }
      }
      .shield-body { animation: shieldPulse 3s ease-in-out infinite; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: rgba(0, 245, 212, 0.06); }
      .shield-check { animation: checkGlow 2.5s ease-in-out infinite; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Shield Frame -->
  <path class="shield-body" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
  <!-- Forensic Verified Checkmark -->
  <path class="shield-check" d="m9 12 2 2 4-4" />
</svg>
