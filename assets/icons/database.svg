<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <style>
      @keyframes dbGlow {
        0%, 100% { stroke: #00f5d4; filter: drop-shadow(0 0 2px #00f5d4); }
        50% { stroke: #38bdf8; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes packetScan {
        0% { transform: translateY(0); opacity: 0.2; }
        50% { transform: translateY(6px); opacity: 1; }
        100% { transform: translateY(12px); opacity: 0.2; }
      }
      .db-shell { animation: dbGlow 3s ease-in-out infinite; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .data-packet { animation: packetScan 2.4s ease-in-out infinite; fill: #00f5d4; }
    </style>
  </defs>
  <!-- Top Disk -->
  <ellipse class="db-shell" cx="12" cy="5" rx="9" ry="3" fill="rgba(0, 245, 212, 0.08)" />
  <!-- Middle Tier -->
  <path class="db-shell" d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
  <!-- Bottom Tier -->
  <path class="db-shell" d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
  <!-- Status Data Indicator Lights -->
  <circle class="data-packet" cx="6" cy="12" r="1" />
  <circle cx="6" cy="5" r="1" fill="#38bdf8" />
  <circle cx="6" cy="19" r="1" fill="#a855f7" />
</svg>
