<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes reticlePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #00f5d4); stroke: #00f5d4; }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 6px #38bdf8); stroke: #38bdf8; }
      }
      .sweep-arm { animation: radarSweep 2.5s linear infinite; transform-origin: 10.5px 10.5px; stroke: #00f5d4; stroke-width: 1.8; }
      .reticle-ring { animation: reticlePulse 2s ease-in-out infinite; transform-origin: 10.5px 10.5px; stroke-width: 1.8; }
    </style>
  </defs>
  <!-- Search Lens Circle -->
  <circle class="reticle-ring" cx="10.5" cy="10.5" r="7.5" fill="rgba(0, 245, 212, 0.05)" />
  <!-- Center Target Crosshairs -->
  <circle cx="10.5" cy="10.5" r="2.5" stroke="#a855f7" stroke-width="1.5" />
  <!-- Radar Sweep Arm -->
  <line class="sweep-arm" x1="10.5" y1="10.5" x2="16.5" y2="5" stroke-linecap="round" />
  <!-- Magnifier Handle -->
  <line x1="16" y1="16" x2="21.5" y2="21.5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
</svg>
