<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <style>
      @keyframes flaskGlow {
        0%, 100% { stroke: #10b981; filter: drop-shadow(0 0 2px #10b981); }
        50% { stroke: #00f5d4; filter: drop-shadow(0 0 6px #00f5d4); }
      }
      @keyframes bubbleRise1 {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(-7px); opacity: 0; }
      }
      @keyframes bubbleRise2 {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(-9px); opacity: 0; }
      }
      .flask-frame { animation: flaskGlow 3s ease-in-out infinite; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .b1 { animation: bubbleRise1 1.8s ease-in-out infinite; fill: #00f5d4; }
      .b2 { animation: bubbleRise2 2.2s ease-in-out infinite 0.5s; fill: #38bdf8; }
    </style>
  </defs>
  <!-- Flask Body -->
  <path class="flask-frame" d="M9 3h6M10 3v5l-6 10.5A2 2 0 0 0 5.7 21h12.6a2 2 0 0 0 1.7-2.5L14 8V3" fill="rgba(16, 185, 129, 0.08)" />
  <!-- Liquid Level -->
  <path d="M6.5 17h11" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <!-- Bubbles -->
  <circle class="b1" cx="10" cy="18" r="1.2" />
  <circle class="b2" cx="14" cy="17" r="1" />
</svg>
