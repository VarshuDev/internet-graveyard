<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <style>
      @keyframes windowGlow {
        0%, 100% { stroke: #38bdf8; filter: drop-shadow(0 0 2px #38bdf8); }
        50% { stroke: #00f5d4; filter: drop-shadow(0 0 6px #00f5d4); }
      }
      @keyframes barProgress {
        0% { width: 3px; }
        50% { width: 14px; }
        100% { width: 3px; }
      }
      .win-frame { animation: windowGlow 3s ease-in-out infinite; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .loading-progress { animation: barProgress 2.8s ease-in-out infinite; fill: #00f5d4; }
    </style>
  </defs>
  <!-- Browser Window Chrome -->
  <rect class="win-frame" x="2" y="3" width="20" height="18" rx="2" fill="rgba(8, 9, 13, 0.7)" />
  <line x1="2" y1="8" x2="22" y2="8" stroke="#38bdf8" stroke-width="1.8" />
  <!-- Titlebar Control Dots -->
  <circle cx="5" cy="5.5" r="1" fill="#ff2a5f" />
  <circle cx="8" cy="5.5" r="1" fill="#f59e0b" />
  <circle cx="11" cy="5.5" r="1" fill="#10b981" />
  <!-- Vintage Address Bar -->
  <rect x="5" y="11" width="14" height="3" rx="1" fill="rgba(30, 41, 59, 0.6)" stroke="#475569" stroke-width="0.8" />
  <!-- Dial-Up Loading Progress Bar -->
  <rect class="loading-progress" x="5" y="16" height="2" rx="0.5" />
</svg>
