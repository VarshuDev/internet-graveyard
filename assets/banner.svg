<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <style>
      @keyframes radarPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); filter: drop-shadow(0 0 12px #00f5d4); }
      }
      @keyframes scanlineMove {
        0% { transform: translateY(0); }
        100% { transform: translateY(380px); }
      }
      @keyframes floatTomb {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .beacon-ring { animation: radarPulse 3s ease-in-out infinite; transform-origin: 600px 190px; }
      .tomb-anim-1 { animation: floatTomb 4s ease-in-out infinite; }
      .tomb-anim-2 { animation: floatTomb 5s ease-in-out infinite 1s; }
      .tomb-anim-3 { animation: floatTomb 4.5s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="80" r="160" fill="#a855f7" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="1000" cy="120" r="180" fill="#00f5d4" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="600" cy="200" r="220" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Perspective Cyber Cemetery Grid -->
  <g stroke="url(#gridGrad)" stroke-width="1">
    <!-- Horizon Line -->
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#00f5d4" stroke-opacity="0.3"/>
    <!-- Vanishing Lines to Center Horizon (600, 260) -->
    <line x1="600" y1="260" x2="-200" y2="380"/>
    <line x1="600" y1="260" x2="0" y2="380"/>
    <line x1="600" y1="260" x2="200" y2="380"/>
    <line x1="600" y1="260" x2="400" y2="380"/>
    <line x1="600" y1="260" x2="500" y2="380"/>
    <line x1="600" y1="260" x2="600" y2="380"/>
    <line x1="600" y1="260" x2="700" y2="380"/>
    <line x1="600" y1="260" x2="800" y2="380"/>
    <line x1="600" y1="260" x2="1000" y2="380"/>
    <line x1="600" y1="260" x2="1200" y2="380"/>
    <line x1="600" y1="260" x2="1400" y2="380"/>
    <!-- Horizontal Cross Grid Lines -->
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="305" x2="1200" y2="305"/>
    <line x1="0" y1="335" x2="1200" y2="335"/>
    <line x1="0" y1="370" x2="1200" y2="370"/>
  </g>

  <!-- Background Cyber Tombstone Silhouettes -->
  <!-- Left Tombstone -->
  <g class="tomb-anim-1" opacity="0.35">
    <path d="M120 260 V200 A30 30 0 0 1 180 200 V260 Z" stroke="#38bdf8" stroke-width="1.5" fill="#090d19"/>
    <line x1="150" y1="210" x2="150" y2="235" stroke="#00f5d4" stroke-width="1.5"/>
    <line x1="140" y1="220" x2="160" y2="220" stroke="#00f5d4" stroke-width="1.5"/>
    <text x="150" y="250" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" text-anchor="middle">VINE.CO</text>
  </g>

  <!-- Mid Left Tombstone -->
  <g class="tomb-anim-2" opacity="0.3">
    <path d="M250 260 V220 A20 20 0 0 1 290 220 V260 Z" stroke="#a855f7" stroke-width="1.5" fill="#090d19"/>
    <line x1="270" y1="230" x2="270" y2="245" stroke="#a855f7" stroke-width="1.2"/>
    <line x1="262" y1="236" x2="278" y2="236" stroke="#a855f7" stroke-width="1.2"/>
    <text x="270" y="254" font-family="'JetBrains Mono', monospace" font-size="7" fill="#64748b" text-anchor="middle">ICQ</text>
  </g>

  <!-- Mid Right Tombstone -->
  <g class="tomb-anim-3" opacity="0.3">
    <path d="M910 260 V215 A25 25 0 0 1 960 215 V260 Z" stroke="#a855f7" stroke-width="1.5" fill="#090d19"/>
    <line x1="935" y1="225" x2="935" y2="242" stroke="#a855f7" stroke-width="1.2"/>
    <line x1="926" y1="232" x2="944" y2="232" stroke="#a855f7" stroke-width="1.2"/>
    <text x="935" y="253" font-family="'JetBrains Mono', monospace" font-size="7" fill="#64748b" text-anchor="middle">GEOCITIES</text>
  </g>

  <!-- Right Tombstone -->
  <g class="tomb-anim-1" opacity="0.35">
    <path d="M1020 260 V195 A32 32 0 0 1 1084 195 V260 Z" stroke="#38bdf8" stroke-width="1.5" fill="#090d19"/>
    <line x1="1052" y1="208" x2="1052" y2="235" stroke="#00f5d4" stroke-width="1.5"/>
    <line x1="1040" y1="218" x2="1064" y2="218" stroke="#00f5d4" stroke-width="1.5"/>
    <text x="1052" y="250" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" text-anchor="middle">READER</text>
  </g>

  <!-- Outer HUD Frame Accents -->
  <rect x="24" y="24" width="1152" height="332" rx="10" stroke="#1e293b" stroke-width="1" fill="none"/>
  <!-- Corner Tech Brackets -->
  <path d="M24 50 V24 H50 M1176 50 V24 H1150 M24 330 V356 H50 M1176 330 V356 H1150" stroke="#00f5d4" stroke-width="2" fill="none"/>

  <!-- Top System Telemetry Bar -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" letter-spacing="1">
    <text x="50" y="46">NODE: ARCHAEOLOGY-CORE // SYS_ID: 1027-RELICS</text>
    <text x="1150" y="46" text-anchor="end" fill="#00f5d4">PROTOCOL: IMMORTAL_ARCHIVE [ACTIVE]</text>
  </g>

  <!-- Center Memorial Cross Emblem (Neon Glow) -->
  <g transform="translate(600, 95)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="32" stroke="#00f5d4" stroke-width="1.5" fill="rgba(0,245,212,0.06)" class="beacon-ring"/>
    <circle cx="0" cy="0" r="22" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- Gothic Cyber Cross -->
    <path d="M-3 -15 H3 V-3 H15 V3 H3 V15 H-3 V3 H-15 V-3 H-3 Z" fill="#00f5d4"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="6" filter="url(#neonGlow)">
    INTERNET GRAVEYARD
  </text>

  <!-- Subtitle -->
  <text x="600" y="212" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" fill="#cbd5e1" text-anchor="middle" letter-spacing="4">
    THE DEFINITIVE DIGITAL ARCHAEOLOGY &amp; LIVING CYBER-CEMETERY
  </text>

  <!-- Epigraph Quote -->
  <text x="600" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-style="italic" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="1">
    &quot;The internet forgets. We archive what disappeared.&quot;
  </text>

  <!-- Bottom Telemetry Badges Array -->
  <g transform="translate(600, 310)">
    <!-- Badge 1: 1,027 Relics -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#0d1424" stroke="#00f5d4" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#00f5d4"/>
      <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f8fafc">1,027+ RELICS</text>
    </g>

    <!-- Badge 2: Gemini 3.8 Flash -->
    <g transform="translate(-190, 0)">
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#0d1424" stroke="#a855f7" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#a855f7"/>
      <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f8fafc">GEMINI 3.8 FLASH</text>
    </g>

    <!-- Badge 3: Web Audio Synth -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#0d1424" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#38bdf8"/>
      <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f8fafc">100% AUDIO SYNTH</text>
    </g>

    <!-- Badge 4: Time Warp -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#0d1424" stroke="#ff2a5f" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#ff2a5f"/>
      <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f8fafc">1990—2026 SCRUB</text>
    </g>
  </g>
</svg>
